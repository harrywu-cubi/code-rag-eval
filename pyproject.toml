[project]
name = "code-rag-eval"
version = "0.1.0"
description = "Code Q&A RAG with a rigorous evaluation harness over the FastAPI corpus"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "typer>=0.12",
    "chromadb>=0.5",
    "openai>=1.40",
    "anthropic>=0.34",
    "python-dotenv>=1",
]

[project.scripts]
code-rag-eval = "code_rag_eval.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
