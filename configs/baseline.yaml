name: baseline
chunking:
  strategy: fixed
  window_lines: 40
  overlap_lines: 10
embedding:
  provider: openai
  model: text-embedding-3-large
retrieval:
  method: vector
  top_k: 5
generation:
  provider: anthropic
  model: mimo-v2.5-pro     # via MiMo (just set MIMO_API_KEY); use claude-sonnet-4-6 for the standard Anthropic API
